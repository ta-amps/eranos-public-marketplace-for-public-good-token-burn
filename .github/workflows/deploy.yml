name: deploy

on:
  workflow_dispatch:
    inputs:
      part:
        description: What to deploy
        type: choice
        options: [both, api, web]
        default: both

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  api:
    name: API to Fly.io
    if: ${{ inputs.part == 'both' || inputs.part == 'api' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: eranos
      - uses: actions/checkout@v4
        with:
          repository: ta-amps/tessera
          path: tessera
          token: ${{ secrets.TESSERA_READ_TOKEN || github.token }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Send only the two repos' sources to the builder
        run: cp eranos/deploy/fly/Dockerfile.dockerignore .dockerignore
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: >-
          flyctl deploy .
          --config eranos/deploy/fly/fly.toml
          --dockerfile eranos/deploy/fly/Dockerfile
          --remote-only

  web:
    name: Web app and edge to Cloudflare
    if: ${{ inputs.part == 'both' || inputs.part == 'web' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy --config deploy/cloudflare/wrangler.jsonc
