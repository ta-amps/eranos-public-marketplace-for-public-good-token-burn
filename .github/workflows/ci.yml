name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: eranos-public-marketplace-for-public-good-token-burn
      - name: Read the Tessera pin from pyproject.toml, the one place it is set
        id: pins
        working-directory: eranos-public-marketplace-for-public-good-token-burn
        run: |
          rev=$(grep -oE 'tessera-infrastructure-work-and-storage-engine\.git@[0-9a-f]{40}' pyproject.toml | cut -d@ -f2)
          test -n "$rev"
          echo "tessera=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ta-amps/tessera-infrastructure-work-and-storage-engine
          ref: ${{ steps.pins.outputs.tessera }}
          path: tessera-infrastructure-work-and-storage-engine
          token: ${{ secrets.TESSERA_READ_TOKEN || github.token }}
      - name: Seed-pack library that the referenced example kits point at
        uses: actions/checkout@v4
        with:
          repository: ta-amps/seed-packs-library-of-nouns-and-verbs
          ref: 168500501378bbd6f625efaf810126d8f5ef017f
          path: seed-packs-library-of-nouns-and-verbs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Install
        working-directory: eranos-public-marketplace-for-public-good-token-burn
        run: uv sync --all-groups
      - name: Lint, types, tests, leak scan, index and architecture checks
        working-directory: eranos-public-marketplace-for-public-good-token-burn
        run: make check
      - name: Two-step volunteer pipeline verification
        working-directory: eranos-public-marketplace-for-public-good-token-burn
        run: make verify-examples
      - name: Tessera conformance suite through Eranos's adapter
        working-directory: eranos-public-marketplace-for-public-good-token-burn
        run: make suite BACKEND=local

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/csp.spec.ts tests/marketplace.spec.ts tests/shell.spec.ts
