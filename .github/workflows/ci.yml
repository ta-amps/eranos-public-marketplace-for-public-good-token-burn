name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: eranos-public-marketplace-for-public-good-token-burn
      - uses: actions/checkout@v4
        with:
          repository: ta-amps/tessera-infrastructure-work-and-storage-engine
          ref: ecca97deb88b82e627df66c98400b3a302e2bdb0
          path: tessera-infrastructure-work-and-storage-engine
          token: ${{ secrets.TESSERA_READ_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Install
        working-directory: eranos-public-marketplace-for-public-good-token-burn
        run: uv sync --all-groups
      - name: Lint, types, tests, leak scan, index and architecture checks
        working-directory: eranos-public-marketplace-for-public-good-token-burn
        run: make check
      - name: Two-step volunteer pipeline verification
        working-directory: eranos-public-marketplace-for-public-good-token-burn
        run: make verify-examples
      - name: Tessera conformance suite through Eranos's adapter
        working-directory: eranos-public-marketplace-for-public-good-token-burn
        run: make suite BACKEND=local

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/csp.spec.ts tests/marketplace.spec.ts
