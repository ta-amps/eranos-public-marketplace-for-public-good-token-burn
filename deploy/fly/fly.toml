app = "eranos-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ERANOS_LOCAL_DB = "/data/eranos.db"
  ERANOS_TRACE = "/data/traces/run.jsonl"

[[mounts]]
  source = "eranos_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
